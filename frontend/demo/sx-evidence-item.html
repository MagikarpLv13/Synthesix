<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Synthesix evidence item demo</title>
    <link rel="stylesheet" href="../../theme.css">
    <script type="module" src="../../assets/synthesix-ui.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .demo { width: min(480px, calc(100vw - 32px)); }
    </style>
  </head>
  <body>
    <div class="demo">
      <ul class="evidence-list">
        <sx-evidence-item class="evidence-item" data-evidence-id="demo-1" title="Capture 2026-06-12">
          <div class="evidence-body">
            <div class="evidence-row">
              <span>Vérifiée</span>
              <span class="evidence-date">12 juin</span>
            </div>
            <div class="evidence-row">
              <a href="#">Archive HTML</a>
            </div>
          </div>
        </sx-evidence-item>
      </ul>
    </div>
  </body>
</html>
