<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Synthesix extracted entity row demo</title>
    <link rel="stylesheet" href="../../theme.css">
    <script type="module" src="../../assets/synthesix-ui.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .demo { width: min(480px, calc(100vw - 32px)); }
    </style>
  </head>
  <body>
    <div class="demo">
      <sx-extracted-entity-row class="entity-chip-row entity-item--proposed" data-entity-id="demo-1">
        <div class="entity-chip-row__head">
          <input type="checkbox" class="entity-chip-row__select" aria-label="Sélectionner pour une action groupée">
          <span class="entity-chip-row__summary">
            <strong>Email</strong>
            <span class="prop-type">Texte</span>
            <span class="entity-chip-row__value" title="alice@example.com">alice@example.com</span>
          </span>
          <span class="entity-chip-row__actions">
            <button type="button" class="icon-action entity-validate" title="Valider" aria-label="Valider">✓</button>
            <button type="button" class="icon-action icon-action--danger entity-reject" title="Rejeter" aria-label="Rejeter">✕</button>
          </span>
        </div>
        <div class="entity-chip-row__fields">
          <input type="text" class="entity-chip-row__name" value="Email" placeholder="Nom de propriété">
          <span class="field-hint">Créez une entité pour rattacher.</span>
        </div>
      </sx-extracted-entity-row>
    </div>
  </body>
</html>
