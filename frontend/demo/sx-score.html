<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Synthesix score demo</title>
    <link rel="stylesheet" href="../../theme.css">
    <script type="module" src="../../assets/synthesix-ui.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .demo {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 16px;
        width: min(720px, calc(100vw - 32px));
      }
    </style>
  </head>
  <body>
    <div class="demo">
      <sx-score level="strong">9.20</sx-score>
      <sx-score level="good">7.80</sx-score>
      <sx-score level="moderate">3.40</sx-score>
      <sx-score level="weak">1.10</sx-score>
      <sx-score level="good" tip>
        7.80
        <ul class="score__list" slot="breakdown">
          <li><span class="score__pts score__pts--strong">+4.0</span> Exact phrase match</li>
          <li><span class="score__pts score__pts--good">+2.0</span> Trusted domain</li>
          <li><span class="score__pts score__pts--low">+1.8</span> Multiple engines</li>
        </ul>
        <small class="score-note" slot="note">Survol ou focus pour voir le détail</small>
      </sx-score>
    </div>
  </body>
</html>
