<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Synthesix page monitor card demo</title>
    <link rel="stylesheet" href="../../theme.css">
    <script type="module" src="../../assets/synthesix-ui.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .demo { width: min(680px, calc(100vw - 32px)); }
    </style>
  </head>
  <body>
    <div class="demo">
      <sx-page-monitor-card class="page-monitor-card" data-page-monitor-id="demo-1">
        <div>
          <a class="result-title" href="#">Example page</a>
          <div class="result-url">https://example.com/page</div>
        </div>
        <div class="page-monitor-summary">
          <span class="meta-pill">2 archive(s)</span>
          <strong>Significant change</strong>
          <span>75.00% text similarity</span>
        </div>
        <button type="button" class="danger-button">Stop monitoring</button>
      </sx-page-monitor-card>
    </div>
  </body>
</html>
