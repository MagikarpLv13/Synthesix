<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Synthesix entity panel demo</title>
    <link rel="stylesheet" href="../../theme.css">
    <script type="module" src="../../assets/synthesix-ui.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .demo { width: min(360px, calc(100vw - 32px)); }
    </style>
  </head>
  <body>
    <div class="demo">
      <sx-entity-panel class="graph-entity-card inspector-entity" data-graph-entity-id="demo-1">
        <div class="entity-section__head" slot="identity">
          <span class="entity-section__title">Identité</span>
          <button type="button" class="icon-action icon-action--danger" title="Delete entity" aria-label="Delete entity">✕</button>
        </div>
        <label class="entity-field" slot="identity">
          <span class="entity-field__label">Nom</span>
          <input type="text" value="Example SAS">
        </label>
        <label class="entity-field" slot="identity">
          <span class="entity-field__label">Notes</span>
          <textarea rows="3" placeholder="Notes…">Source confidentielle</textarea>
        </label>
        <div class="entity-field" slot="identity">
          <span class="entity-field__label">Tags</span>
          <div class="tag-editor">
            <div class="tag-editor__chips">
              <span class="tag-chip">Entreprise<button type="button" class="tag-chip__remove" aria-label="Remove tag">&times;</button></span>
            </div>
            <input type="text" class="tag-editor__input" placeholder="Nouveau tag…">
          </div>
        </div>

        <span class="entity-section__title" slot="properties">Propriétés</span>
        <ul class="graph-property-list" slot="properties">
          <li>
            <div class="graph-property-head">
              <span class="graph-property-key"><strong>SIREN</strong> <span class="prop-type">Texte</span></span>
              <span class="graph-property-actions">
                <button type="button" class="icon-action icon-action--danger" title="Remove property" aria-label="Remove property">✕</button>
              </span>
            </div>
            <span class="graph-property-value">537898678</span>
          </li>
        </ul>
        <form class="graph-property-add" slot="properties">
          <input type="text" class="graph-property-add__key" placeholder="Propriété" aria-label="Nom de la propriété">
          <input type="text" class="graph-property-add__value" placeholder="Valeur" aria-label="Valeur de la propriété">
          <button type="submit" class="secondary-button graph-property-add__submit">Ajouter</button>
        </form>

        <span class="entity-section__title" slot="relations">Relations</span>
        <ul class="entity-relation-list" slot="relations">
          <li class="entity-relation">
            <input type="text" class="entity-relation__label" value="Dirigée par">
            <button type="button" class="entity-relation__target entity-relation__goto">→ Jane Doe</button>
            <button type="button" class="icon-action icon-action--danger" title="Supprimer la relation" aria-label="Supprimer la relation">✕</button>
          </li>
        </ul>
        <form class="entity-relation-add" slot="relations">
          <input type="text" class="entity-relation-add__label" placeholder="Mot clé (ex. PDG de)">
          <select class="entity-relation-add__target"><option value="">Entité…</option></select>
          <button type="submit" class="secondary-button">Lier</button>
        </form>

        <span class="entity-section__title" slot="sources">Sources</span>
        <ul class="entity-source-list" slot="sources">
          <li class="entity-source-card">
            <span class="source-ref source-ref--list">1</span>
            <a href="#">Registre du commerce</a>
          </li>
        </ul>
      </sx-entity-panel>
    </div>
  </body>
</html>
